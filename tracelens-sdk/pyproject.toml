[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tracelens-sdk"
version = "0.3.0"
description = "Framework-independent execution tracing SDK for Python RAG applications"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tracelens_sdk*"]
