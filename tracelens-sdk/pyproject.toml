[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tracelens-sdk"
version = "0.5.4"
description = "Python SDK for RAG observability, tracing, and evidence-backed diagnostics"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1.0"]

[project.scripts]
tracelens-doctor = "tracelens_sdk.cli:main"

[project.optional-dependencies]
langchain = ["langchain-core>=0.3,<2.0"]
dev = ["pytest>=8.0,<9.0", "pytest-cov>=5.0,<7.0", "build>=1.2,<2.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tracelens_sdk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
