name: TraceLens CI
on:
  push:
  pull_request:
jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Backend tests
        working-directory: tracelens-backend
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -q
      - name: SDK and LangChain callback tests
        working-directory: tracelens-sdk
        run: |
          python -m pip install -e '.[langchain]' pytest
          python -m pytest -q
      - name: Customer-support knowledge-base tests
        run: |
          python -m pip install pytest
          python -m pytest -q rag-customer-support/tests
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: tracelens-frontend
        run: npm install
      - working-directory: tracelens-frontend
        run: npm run build
