name: TraceLens CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:
jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            tracelens-backend/requirements.txt
            tracelens-sdk/pyproject.toml
      - name: Install SDK and backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./tracelens-sdk
          python -m pip install -r tracelens-backend/requirements.txt
      - name: Run backend unit tests
        working-directory: tracelens-backend
        run: python -m pytest -q
      - name: Run SDK unit tests
        run: python -m pytest -q tracelens-sdk/tests
      - name: Check SDK import
        run: python -c "from tracelens_sdk import TraceLens, TraceEvent; print('TraceLens SDK import OK')"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check dashboard JavaScript syntax
        run: node --check tracelens-backend/app/static/app.js

      - name: Compile all Python source files
        run: python -m compileall -q tracelens-sdk/tracelens_sdk tracelens-backend/app rag-project-1 rag-project-2 scripts
